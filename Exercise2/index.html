<html>
    <head>
        <meta charset ="UTF-8">
        <title>Survey Form</title>
        
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet"
        href="newcss.css">
        <script
        src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
        <script
        src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js">

    </head>
    <body>
        <script src="D:\Users\admin\Documents\bootstrap-5.3.8-dist\js\bootstrap.min.js"></script>
        <img src="images\images.png">
        <h3 style = "color:#009999;"> Survey </h3>
        if you have a moment, we'd appreciate if you would fill out this survey
        <h3 style = "color:#009999;"> Your information: </h3>
        <form>
            <label for="firstname">First Name</label>
            <div class = "form-grid">
                <input type="text" id="firstname" name="firstname" ><br><br>
            </div>
            <label for="lastname">Last Name</label>
            <div class = "form-grid">
                <input type="text" id="lastname" name="firstname"><br><br>
            </div>
            <label for="email">Email:</label>
            <div class = "form-grid">
                <input type="email" id="email" pattern=".+@example\.com"><br><br>
            </div>
            <label for="birthday">Birthday:</label>
            <div class = "form-grid">
                 <input type="date" id="birthday" name="birthday"><br><br>
            </div>
        </form>
        <h3 style = "color:#009999;"> How did you hear about us </h3>
        <label class="radio">
            <input type="radio" > Search Engine&nbsp;
        </label>
        <label class="radio">
            <input type="radio"> Word of Mouth&nbsp;
        </label>
        <label class="radio">
            <input type="radio" > Social Media&nbsp;
        </label>
        <label class="radio">
            <input type="radio"> Other&nbsp;
        </label>
        <h3 style = "color:#009999;"> Would you like to receive announcements about new CDs and special offers? </h3>
        <input type="checkbox"> Yes, I'd like that <br><br>
        <input type="checkbox"> Yes,please send me email announcements <br><br>
        Please contact me by: 
        <select name="option" id="options">
            <option>Email or Postal Mail</option>
            <option> Email only</option>
            <option>Postal Mail only</option>
        </select><br><br>
        <input type="submit" value="Submit">
    </body>
</html>
